<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebateSpace - Research & Fact Check</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔍 DebateSpace</h1>
            <p>Fact Check · Government Sources · News Articles · Video Explanations</p>
        </div>

        <!-- Search Form -->
        <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" placeholder="Enter your research query..." required>
            <button type="submit" id="searchBtn">Research</button>
        </form>

        <!-- Loading Indicator -->
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Researching <span id="loadingQuery"></span>...</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="error" style="display: none;"></div>

        <!-- Results Container -->
        <div id="results" class="results" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>

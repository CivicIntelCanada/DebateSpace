<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debate Fact Checker - Left, Centre, Right Sources</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🗳️ Debate Fact Checker</h1>
        <p class="subtitle">Left • Centre • Right • With Sources</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Enter any debate claim... e.g., 'Did inflation go down under Biden?'">
            <button onclick="searchDebate()">🔍 Fact Check</button>
        </div>
        
        <div class="loading" id="loading" style="display:none;">
            <div class="spinner"></div>
            <p>Searching sources and generating rebuttals...</p>
        </div>
        
        <div id="results" class="results"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
